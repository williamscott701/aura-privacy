# Publishes the three public pages: support, privacy policy, terms of use.
#
# App Store Connect will not accept the app record without a Privacy Policy URL and a
# Support URL that both resolve, and App Review opens the legal links from the paywall
# and from Settings — `LegalLinks.privacy` and `LegalLinks.terms` point here.
#
# This repository exists only to serve those pages. The app itself is in the private
# `williamscott701/aura`, checked out locally at ~/Desktop/Aura/migraine-diary, and it
# stays private: GitHub Pages needs a public repository on a free plan, and publishing
# the app repository to get three pages would also publish its `docs/` — the ASO
# strategy, the revenue-model note and the pricing.
#
# The HTML is generated by `scripts/make-support-site.py` in the app repository and
# committed here. Do not hand-edit it; edit the script and re-run it.
#
# The path filter covers every page rather than just `index.html`. It used to name only
# that file, which meant a change to `privacy.html` or `terms.html` alone would have been
# pushed and never deployed — a stale legal document with a green checkmark next to it.
#
# One-time setup: Settings → Pages → Source → GitHub Actions.

name: Publish the support site

on:
  push:
    branches: [master]
    paths:
      - "**.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and do not cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
